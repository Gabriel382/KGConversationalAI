[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kgconvai"
version = "0.5.0"
description = "Graph-driven voice agent with a Thought-Action-Observation control loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Henrique Alencar Medeiros", email = "henrique382@gmail.com" }]
keywords = ["voice", "agent", "dialogue", "knowledge-graph", "tao", "whisper", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "webrtcvad>=2.0.10",
    "pyttsx3>=2.90",
]
nlu = [
    "transformers>=4.40",
    "torch>=2.2",
]
embeddings = [
    "sentence-transformers>=2.7",
]
kg = [
    "rdflib>=7.0",
    "jsonschema>=4.20",
]
neo4j = [
    "neo4j>=5.20",
]
web = [
    "gradio>=4.40",
    "streamlit>=1.36",
    "pyvis>=0.3",
]
api = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.7",
    "rdflib>=7.0",
    "jsonschema>=4.20",
    "neo4j>=5.20",
    "gradio>=4.40",
    "streamlit>=1.36",
    "pyvis>=0.3",
    "pyyaml>=6.0",
    "types-PyYAML",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
kgconvai = "kgconvai.cli:app"

[project.urls]
Homepage = "https://github.com/Gabriel382/KGConversationalAI"
Issues = "https://github.com/Gabriel382/KGConversationalAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kgconvai"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
"src/kgconvai/cli.py" = ["B008"]  # typer requires function calls in defaults

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: end-to-end tests that wire the full TAO cycle (deselect with -m 'not integration')",
    "slow: tests that take more than a second",
    "neo4j: tests that require a reachable Neo4j server (auto-skip otherwise)",
]

[tool.coverage.run]
source = ["src/kgconvai"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
