name: Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intents:
    name: Intent eval (${{ matrix.classifier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        classifier: ["substring"]   # add 'embedding' or 'zero_shot' once you're happy with cold-start cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyyaml

      - name: Run intent eval
        id: intents
        run: |
          python -m kgconvai eval intents \
            --classifier ${{ matrix.classifier }} \
            --json-out intent-metrics-${{ matrix.classifier }}.json \
            --threshold 0.40 \
            --no-show-examples

      - name: Run FAQ eval
        if: always()
        run: |
          python -m kgconvai eval faq \
            --classifier ${{ matrix.classifier }} \
            --json-out faq-metrics-${{ matrix.classifier }}.json \
            --threshold 0.50 \
            --no-show-examples

      - name: Upload metrics JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-${{ matrix.classifier }}
          path: |
            intent-metrics-*.json
            faq-metrics-*.json
          if-no-files-found: ignore

      - name: Comment metrics on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cls = '${{ matrix.classifier }}';
            const read = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p)) : null;
            const i = read(`intent-metrics-${cls}.json`);
            const f = read(`faq-metrics-${cls}.json`);
            const fmt = (m) => m ? `| ${(m.metrics.accuracy*100).toFixed(1)}% | ${(m.metrics.p_at_3*100).toFixed(1)}% | ${m.metrics.mrr.toFixed(3)} | ${m.metrics.latency_ms_p50.toFixed(1)} |` : '| -- | -- | -- | -- |';
            const body = [
              `### Eval results — classifier: \`${cls}\``,
              '',
              '| Suite | Acc / P@1 | P@3 | MRR | p50 ms |',
              '|-------|-----------|-----|-----|--------|',
              `| Intents (n=${i?.metrics?.n ?? '?'}) ${fmt(i)}`,
              `| FAQ (n=${f?.metrics?.n ?? '?'}) ${fmt(f)}`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
